# Secret-scanning configuration for gitleaks (CI job `secrets`; the pre-release
# full-history scan follows the same rules).
#
# The default gitleaks rule set is enough for this repository: the committed
# synthetic fixtures use fictional names, tickers and identifiers, and no rule
# flags them. Do not add broad allowlists here. If a new fixture trips a rule,
# allowlist the exact fake value, never a directory that could hold real issuer
# files (raw/, build/) or secrets (.env).
#
# Release gate (PLAYBOOK §12.3): a fresh clone of every branch was scanned with
# `gitleaks git --log-opts="--all"` on 2026-10-22 (gitleaks 8.30.1) and had no
# findings. Re-run that command before changing the repository's visibility.
[extend]
useDefault = true

# Source registry for cad-etf-holdings.
#
# Every source carries a terms-of-use record. A source is collected only when
# its decision is `allowed` or `allowed_with_conditions` AND `supported: true`;
# anything else means "do not fetch". The decisions below were recorded by the
# human reviewer on 2026-10-17 (D40).

sources:
  - id: ishares_ca_daily
    issuer: ishares_ca
    kind: daily_holdings
    format: csv
    url_patterns:
      - "https://www.blackrock.com/ca/investors/en/products/<product_id>/<slug>/1464253357814.ajax?fileType=csv&fileName=<TICKER>_holdings&dataType=fund"
    update_frequency: daily
    supported: true
    notes: "not selected: terms prohibit automated access without written permission"
    terms:
      url: "https://www.blackrock.com/ca/investors/en/terms-and-conditions"
      reviewer: Moksh Siruvani
      reviewed_on: 2026-10-17
      decision: not_allowed


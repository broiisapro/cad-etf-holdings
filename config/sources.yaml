# Source registry for cad-etf-holdings.
#
# Every source carries a terms-of-use record. A source is collected only when
# its decision is `allowed` or `allowed_with_conditions` AND `supported: true`;
# anything else means "do not fetch". All real candidate sources start as
# `pending_review` until a human records a decision with a reviewer and date.

sources:
  - id: ishares_ca_daily
    issuer: ishares_ca
    kind: daily_holdings
    format: csv
    url_patterns:
      - "https://www.blackrock.com/ca/investors/en/products/<product_id>/<slug>/1464253357814.ajax?fileType=csv&fileName=<TICKER>_holdings&dataType=fund"
    update_frequency: daily
    supported: true
    notes: "terms prohibit automated access without written permission"
    terms:
      url: "https://www.blackrock.com/ca/investors/en/terms-and-conditions"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: ishares_ca_qpd
    issuer: ishares_ca
    kind: quarterly_disclosure
    format: pdf
    url_patterns:
      - "https://www.blackrock.com/ca/investors/en/literature/quarterly-portfolio-disclosure/qpd-<ticker>-en-ca.pdf"
    update_frequency: quarterly
    supported: true
    notes: ""
    terms:
      url: "https://www.blackrock.com/ca/investors/en/terms-and-conditions"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: bmo_daily
    issuer: bmo
    kind: daily_holdings
    format: xlsx
    url_patterns:
      - "https://df.bmogam.com/assets/static/reports/etf-funds-holdings/Holdings_Extract_en_US_<TICKER>_<YYYYMMDD>.xlsx"
    update_frequency: daily
    supported: true
    notes: ""
    terms:
      url: "https://bmogam.com/ca-en/legal/"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: bmo_qpd
    issuer: bmo
    kind: quarterly_disclosure
    format: pdf
    url_patterns:
      - "https://bmogam.com/ca-en/investing-resources/legal-and-regulatory-documents/"
    update_frequency: quarterly
    supported: true
    notes: "listing page; documents are hosted on bmo.bynder.com"
    terms:
      url: "https://bmogam.com/ca-en/legal/"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: vanguard_ca_daily
    issuer: vanguard_ca
    kind: daily_holdings
    format: xlsx
    url_patterns:
      - "https://www.vanguard.ca/en/product/etf/<TICKER>"
    update_frequency: daily
    supported: false
    notes: "page is JavaScript-rendered, no static download link"
    terms:
      url: "https://www.vanguard.ca/en/website-terms-of-use"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: vanguard_ca_qpd
    issuer: vanguard_ca
    kind: quarterly_disclosure
    format: pdf
    url_patterns:
      - "https://fund-docs.vanguard.com/qpd-<TICKER>-en.pdf"
    update_frequency: quarterly
    supported: true
    notes: ""
    terms:
      url: "https://www.vanguard.ca/en/website-terms-of-use"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: globalx_ca_daily
    issuer: globalx_ca
    kind: daily_holdings
    format: csv
    url_patterns:
      - "https://www.globalx.ca/product/<slug>"
    update_frequency: daily
    supported: false
    notes: "only top 10 holdings shown; bot challenge"
    terms:
      url: "https://www.globalx.ca/terms-of-use"
      reviewer: null
      reviewed_on: null
      decision: pending_review

  - id: globalx_ca_qpd
    issuer: globalx_ca

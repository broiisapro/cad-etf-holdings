  # Synthetic sources used by tests and fixtures. No network requests are ever
  # made for these; the URL scheme is synthetic://.
  - id: syn_csv
    issuer: synthetic
    kind: synthetic
    format: csv
    url_patterns:
      - "synthetic://fixtures/<TICKER>.csv"
    update_frequency: daily
    supported: true
    notes: "generated by etfh.synthetic"
    terms:
      url: "synthetic://fixtures/syn_csv"
      reviewer: "synthetic fixture"
      reviewed_on: 2026-10-16
      decision: allowed
      redistribution_allowed: true


name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # D60: the runner label set comes from the repository variable CI_RUNS_ON so
    # public ship is one variable change. Unset keeps the private-repo self-hosted runner.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python 3.12 (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: uv python install 3.12
      - name: Show uv version
        run: uv --version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint and format check
        run: uv run ruff check . && uv run ruff format --check .

  types:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python 3.12 (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: uv python install 3.12
      - name: Show uv version
        run: uv --version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Type check
        run: uv run mypy etfh

  tests:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python 3.12 (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: uv python install 3.12
      - name: Show uv version
        run: uv --version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q -m "not network"

  # Non-required job (D60): a leaked secret should be visible on the PR without
  # blocking the merge gate. It follows the same runner choice as the required jobs,
  # so the private phase stays on the self-hosted runner and ship moves every job
  # with one variable change.
  secrets:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the pull request commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show uv version
        run: uv --version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint and format check
        run: uv run ruff check . && uv run ruff format --check .

  types:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show uv version
        run: uv --version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Type check
        run: uv run mypy etfh

  tests:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show uv version
        run: uv --version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q -m "not network"

[project]
name = "cad-etf-holdings"
version = "0.1.0"
description = "Point-in-time Canadian ETF holdings: terms-gated collection, PDF/CSV/XLSX parsing, security master, change detection, overlap analytics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "etf",
    "canada",
    "holdings",
    "data-engineering",
    "web-scraping",
    "pdf-extraction",
    "duckdb",
    "streamlit",
    "financial-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<0.29",
    "tenacity>=9,<10",
    "pdfplumber>=0.11,<0.12",
    "camelot-py>=2.0,<3",
    "openpyxl>=3.1,<4",
    "polars>=2,<3",
    "fastexcel>=0.21,<1",
    "rapidfuzz>=3,<4",
    "duckdb>=1.4,<2",
    "pyarrow>=21,<27",
    "pandera[polars]>=0.34,<0.35",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "streamlit>=1.66,<2",
    "altair>=6,<7",
    "typer>=0.27,<1",
]

[project.scripts]
etfh = "etfh.cli:app"

[project.urls]
Repository = "https://github.com/broiisapro/cad-etf-holdings"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "hypothesis>=6,<7",
    "ruff>=0.17,<1",
    "mypy>=2,<3",
    "reportlab>=5,<6",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etfh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["etfh"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["etfh"]

[[tool.mypy.overrides]]
module = ["yaml", "camelot", "pdfplumber", "openpyxl", "reportlab.lib.pagesizes", "reportlab.pdfgen"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not network"'
markers = ["network: tests that make live network requests (excluded from CI)"]
